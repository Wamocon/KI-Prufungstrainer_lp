<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="KI-Prüfungstrainer Icon">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <!-- Book left page -->
  <rect x="100" y="130" width="136" height="200" rx="16" fill="url(#indigoGrad)" opacity="0.9"/>
  <!-- Book right page -->
  <rect x="276" y="130" width="136" height="200" rx="16" fill="url(#indigoGrad)" opacity="0.7"/>
  <!-- Book spine -->
  <rect x="236" y="120" width="40" height="220" rx="8" fill="url(#indigoGrad)"/>
  <!-- Lines on left page (text lines) -->
  <rect x="120" y="168" width="96" height="8" rx="4" fill="white" opacity="0.6"/>
  <rect x="120" y="188" width="80" height="8" rx="4" fill="white" opacity="0.5"/>
  <rect x="120" y="208" width="88" height="8" rx="4" fill="white" opacity="0.5"/>
  <rect x="120" y="228" width="72" height="8" rx="4" fill="white" opacity="0.4"/>
  <!-- Lines on right page -->
  <rect x="296" y="168" width="96" height="8" rx="4" fill="white" opacity="0.6"/>
  <rect x="296" y="188" width="80" height="8" rx="4" fill="white" opacity="0.5"/>
  <rect x="296" y="208" width="88" height="8" rx="4" fill="white" opacity="0.5"/>
  <rect x="296" y="228" width="72" height="8" rx="4" fill="white" opacity="0.4"/>
  <!-- AI brain/checkmark circle -->
  <circle cx="256" cy="370" r="58" fill="url(#indigoGrad)"/>
  <circle cx="256" cy="370" r="48" fill="#eef2ff"/>
  <circle cx="256" cy="370" r="38" fill="url(#indigoGrad)"/>
  <!-- Checkmark -->
  <path d="M236 370 L249 383 L278 354" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
